<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740" role="img" aria-label="Batería de móvil hinchada, la pantalla se separa del marco">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101016"/><stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a34"/><stop offset="0.5" stop-color="#1a1a22"/><stop offset="1" stop-color="#24242e"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.32" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
    <rect width="600" height="740" fill="url(#bg)"/>
    <rect x="150" y="60" width="300" height="620" rx="34" fill="url(#metal)" stroke="#3a3a46" stroke-width="2"/>
    <rect x="162" y="72" width="276" height="596" rx="26" fill="#0d1016"/>
    <rect x="258" y="80" width="84" height="20" rx="10" fill="#0b0b0f"/>
  <!-- La pantalla se ha levantado: hueco visible a los lados -->
  <path d="M162 96 Q152 370 162 644" fill="none" stroke="#4a4a56" stroke-width="3" stroke-linecap="round"/>
  <path d="M438 96 Q448 370 438 644" fill="none" stroke="#4a4a56" stroke-width="3" stroke-linecap="round"/>
  <path d="M162 96 Q152 370 162 644 L172 640 Q164 370 172 100 Z" fill="#000" opacity="0.35"/>
  <path d="M438 96 Q448 370 438 644 L428 640 Q436 370 428 100 Z" fill="#000" opacity="0.35"/>

  <g transform="translate(300,340)">
    <defs>
      <linearGradient id="battBad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff9a52"/><stop offset="1" stop-color="#d6362a"/>
      </linearGradient>
    </defs>
    <!-- Terminal (polo) -->
    <rect x="-16" y="-113" width="32" height="18" rx="4" fill="#8a8a94"/>
    <!-- Cuerpo hinchado -->
    <path d="M-54 -95 Q-54 -104 -44 -104 L44 -104 Q54 -104 54 -95
             L67 0 L54 95 Q54 104 44 104 L-44 104 Q-54 104 -54 95
             L-67 0 Z" fill="url(#battBad)" stroke="#7a2015" stroke-width="2.5"/>
    <!-- Arrugas del sobre hinchado -->
    <g stroke="#7a2015" stroke-opacity="0.45" fill="none" stroke-width="2" stroke-linecap="round">
      <path d="M-40 -70 Q0 -78 40 -70"/>
      <path d="M-48 -20 Q0 -30 48 -20"/>
      <path d="M-48 30 Q0 20 48 30"/>
      <path d="M-40 75 Q0 66 40 75"/>
    </g>
    <text x="0" y="8" text-anchor="middle" font-family="Outfit,sans-serif" font-size="15" font-weight="800" fill="#3a0f08" opacity="0.75">+</text>
  </g>
  
    <g transform="translate(300,520)">
      <path d="M0 -27 L24 13 L-24 13 Z" fill="#FFE01A" opacity="0.92"/>
      <text x="0" y="8" text-anchor="middle" font-family="Outfit,sans-serif" font-size="19" font-weight="900" fill="#1a1400">!</text>
    </g>
  <rect x="162" y="72" width="276" height="596" rx="26" fill="url(#brillo)"/>

  <g font-family="Outfit, sans-serif" text-anchor="middle">
    <rect x="205" y="690" width="190" height="34" rx="17" fill="#EC008C" opacity="0.17" stroke="#EC008C" stroke-opacity="0.55"/>
    <text x="300" y="713" fill="#ff7ac7" font-size="17" font-weight="700">ANTES</text>
  </g></svg>