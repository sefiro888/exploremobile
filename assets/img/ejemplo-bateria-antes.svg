<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740" role="img" aria-label="Bateria de movil hinchada, con la carcasa levantada">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101016"/><stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a34"/><stop offset="0.5" stop-color="#1a1a22"/><stop offset="1" stop-color="#24242e"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a227"/><stop offset="0.5" stop-color="#f2d65c"/><stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.32" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="740" fill="url(#bg)"/>
  <g transform="translate(300,330)">
    <!-- Carcasa trasera levantada por la hinchazón -->
    <path d="M-160 -230 L160 -230 L172 250 L-172 250 Z" fill="url(#metal)" stroke="#3a3a46" stroke-width="2"/>
    <!-- Batería hinchada (abombada) -->
    <path d="M-118 -150
             C -150 -60, -150 60, -118 150
             L 118 150
             C 150 60, 150 -60, 118 -150 Z"
          fill="#2b2530" stroke="#6b5a3a" stroke-width="2.5"/>
    <!-- Volumen del abombamiento -->
    <ellipse cx="0" cy="0" rx="120" ry="140" fill="#3a2f22" opacity="0.55"/>
    <ellipse cx="-18" cy="-24" rx="86" ry="100" fill="#4a3a26" opacity="0.5"/>
    <ellipse cx="-30" cy="-40" rx="48" ry="58" fill="#5c4930" opacity="0.45"/>
    <!-- Contactos -->
    <rect x="-30" y="-176" width="60" height="26" rx="5" fill="url(#oro)" opacity="0.8"/>
    <!-- Grietas de tensión en la carcasa -->
    <g stroke="#c9d0f5" stroke-opacity="0.4" fill="none" stroke-linecap="round">
      <path d="M-160 -120 L-186 -140" stroke-width="2"/>
      <path d="M160 -60 L188 -76" stroke-width="2"/>
      <path d="M-166 90 L-192 108" stroke-width="1.6"/>
    </g>
    <!-- Aviso -->
    <g transform="translate(0,208)">
      <path d="M0 -30 L26 14 L-26 14 Z" fill="#FFE01A" opacity="0.9"/>
      <text x="0" y="9" text-anchor="middle" font-family="Outfit,sans-serif" font-size="20" font-weight="900" fill="#1a1400">!</text>
    </g>
  </g>
  <g font-family="Outfit, sans-serif" text-anchor="middle">
    <rect x="205" y="690" width="190" height="34" rx="17" fill="#EC008C" opacity="0.17" stroke="#EC008C" stroke-opacity="0.55"/>
    <text x="300" y="713" fill="#ff7ac7" font-size="17" font-weight="700">ANTES</text>
  </g></svg>