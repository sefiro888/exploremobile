<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740" role="img" aria-label="Bateria nueva, plana, con la carcasa cerrada correctamente">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101016"/><stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a34"/><stop offset="0.5" stop-color="#1a1a22"/><stop offset="1" stop-color="#24242e"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a227"/><stop offset="0.5" stop-color="#f2d65c"/><stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.32" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="740" fill="url(#bg)"/>
  <g transform="translate(300,330)">
    <rect x="-160" y="-230" width="320" height="480" rx="26" fill="url(#metal)" stroke="#3a3a46" stroke-width="2"/>
    <rect x="-118" y="-150" width="236" height="300" rx="14" fill="#1d2620" stroke="#57B75B" stroke-width="2.5"/>
    <rect x="-30" y="-176" width="60" height="26" rx="5" fill="url(#oro)"/>
    <!-- Indicador de carga completa -->
    <g transform="translate(0,0)">
      <rect x="-86" y="-16" width="172" height="32" rx="16" fill="#0f1a12" stroke="#57B75B" stroke-opacity="0.5"/>
      <rect x="-82" y="-12" width="164" height="24" rx="12" fill="#57B75B" opacity="0.85"/>
      <text x="0" y="7" text-anchor="middle" font-family="Outfit,sans-serif" font-size="16" font-weight="800" fill="#06240b">100%</text>
    </g>
    <text x="0" y="96" text-anchor="middle" font-family="Outfit,sans-serif" font-size="15" font-weight="600" fill="#8ce090" opacity="0.9">Bater&#237;a nueva</text>
    <!-- Marca de verificado -->
    <g transform="translate(0,206)">
      <circle cx="0" cy="0" r="26" fill="#57B75B" opacity="0.2" stroke="#57B75B" stroke-width="2"/>
      <path d="M-11 1 L-3 9 L12 -8" fill="none" stroke="#8ce090" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <g font-family="Outfit, sans-serif" text-anchor="middle">
    <rect x="205" y="690" width="190" height="34" rx="17" fill="#57B75B" opacity="0.17" stroke="#57B75B" stroke-opacity="0.55"/>
    <text x="300" y="713" fill="#8ce090" font-size="17" font-weight="700">DESPU&#201;S</text>
  </g></svg>