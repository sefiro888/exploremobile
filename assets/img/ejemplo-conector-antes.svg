<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740" role="img" aria-label="Cable de carga sin hacer contacto en el conector del móvil">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101016"/><stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a34"/><stop offset="0.5" stop-color="#1a1a22"/><stop offset="1" stop-color="#24242e"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.32" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
    <rect width="600" height="740" fill="url(#bg)"/>
    <rect x="150" y="60" width="300" height="620" rx="34" fill="url(#metal)" stroke="#3a3a46" stroke-width="2"/>
    <rect x="162" y="72" width="276" height="596" rx="26" fill="#12100d"/>
    <rect x="258" y="80" width="84" height="20" rx="10" fill="#0b0b0f"/>
  
    <g transform="translate(300,310) scale(1)">
      <rect x="-46" y="-20" width="92" height="40" rx="20" fill="#0a0a0e" stroke="#4a4a56" stroke-width="3"/>
      <rect x="-32" y="-10" width="64" height="20" rx="10" fill="#1c1c24" stroke="#5a5a68" stroke-width="2"/>
    </g>
  <!-- Cable que no llega a conectar -->
  <path d="M300 380 L300 440 L260 480 L260 560"
        fill="none" stroke="#5a5a68" stroke-width="14" stroke-linecap="round"/>
  <rect x="286" y="364" width="28" height="20" rx="6" fill="#2a2a34" stroke="#6a6a78" stroke-width="2"/>
  <!-- Hueco de desconexión -->
  <g stroke="#ff5a6e" stroke-width="4" stroke-linecap="round">
    <path d="M320 388 L340 408"/>
    <path d="M340 388 L320 408"/>
  </g>
  <!-- Polvo/pelusa en el puerto -->
  <g fill="#8a7f6a" opacity="0.85">
    <circle cx="286" cy="310" r="3"/>
    <circle cx="296" cy="316" r="2.4"/>
    <circle cx="308" cy="308" r="2.8"/>
    <circle cx="314" cy="314" r="2"/>
  </g>
  
    <g transform="translate(300,520)">
      <path d="M0 -27 L24 13 L-24 13 Z" fill="#FFE01A" opacity="0.92"/>
      <text x="0" y="8" text-anchor="middle" font-family="Outfit,sans-serif" font-size="19" font-weight="900" fill="#1a1400">!</text>
    </g>
  <text x="300" y="565" text-anchor="middle" font-family="Outfit,sans-serif" font-size="15" font-weight="600" fill="#c2b79c" opacity="0.85">No hace contacto</text>
  <rect x="162" y="72" width="276" height="596" rx="26" fill="url(#brillo)"/>

  <g font-family="Outfit, sans-serif" text-anchor="middle">
    <rect x="205" y="690" width="190" height="34" rx="17" fill="#EC008C" opacity="0.17" stroke="#EC008C" stroke-opacity="0.55"/>
    <text x="300" y="713" fill="#ff7ac7" font-size="17" font-weight="700">ANTES</text>
  </g></svg>