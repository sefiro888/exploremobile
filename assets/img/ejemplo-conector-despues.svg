<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740" role="img" aria-label="Conector de carga limpio, con los contactos en buen estado">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101016"/><stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a34"/><stop offset="0.5" stop-color="#1a1a22"/><stop offset="1" stop-color="#24242e"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a227"/><stop offset="0.5" stop-color="#f2d65c"/><stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.32" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="740" fill="url(#bg)"/>
  <g transform="translate(300,330)">
    <rect x="-190" y="-120" width="380" height="240" rx="28" fill="url(#metal)" stroke="#3a3a46" stroke-width="2"/>
    <rect x="-110" y="-40" width="220" height="80" rx="16" fill="#0a0a0e" stroke="#57B75B" stroke-width="2.5"/>
    <!-- Lengüeta central limpia con contactos dorados -->
    <rect x="-70" y="-11" width="140" height="22" rx="11" fill="#1c1c24" stroke="#3a3a46"/>
    <g fill="url(#oro)">
      <rect x="-62" y="-7" width="9" height="14" rx="2"/><rect x="-46" y="-7" width="9" height="14" rx="2"/>
      <rect x="-30" y="-7" width="9" height="14" rx="2"/><rect x="-14" y="-7" width="9" height="14" rx="2"/>
      <rect x="4"  y="-7" width="9" height="14" rx="2"/><rect x="20" y="-7" width="9" height="14" rx="2"/>
      <rect x="36" y="-7" width="9" height="14" rx="2"/><rect x="52" y="-7" width="9" height="14" rx="2"/>
    </g>
    <!-- Rayo de carga -->
    <g transform="translate(0,148)">
      <path d="M6 -30 L-14 2 L-1 2 L-6 26 L14 -6 L1 -6 Z" fill="#57B75B" opacity="0.95"/>
    </g>
    <text x="0" y="212" text-anchor="middle" font-family="Outfit,sans-serif" font-size="15" font-weight="600" fill="#8ce090" opacity="0.9">Carga con normalidad</text>
  </g>
  <g font-family="Outfit, sans-serif" text-anchor="middle">
    <rect x="205" y="690" width="190" height="34" rx="17" fill="#57B75B" opacity="0.17" stroke="#57B75B" stroke-opacity="0.55"/>
    <text x="300" y="713" fill="#8ce090" font-size="17" font-weight="700">DESPU&#201;S</text>
  </g></svg>