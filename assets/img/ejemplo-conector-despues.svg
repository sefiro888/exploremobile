<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 740" width="600" height="740" role="img" aria-label="Cable de carga conectado correctamente, el móvil está cargando">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101016"/><stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2a34"/><stop offset="0.5" stop-color="#1a1a22"/><stop offset="1" stop-color="#24242e"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.32" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
    <rect width="600" height="740" fill="url(#bg)"/>
    <rect x="150" y="60" width="300" height="620" rx="34" fill="url(#metal)" stroke="#3a3a46" stroke-width="2"/>
    <rect x="162" y="72" width="276" height="596" rx="26" fill="#0d140f"/>
    <rect x="258" y="80" width="84" height="20" rx="10" fill="#0b0b0f"/>
  
    <g transform="translate(300,310) scale(1)">
      <rect x="-46" y="-20" width="92" height="40" rx="20" fill="#0a0a0e" stroke="#4a4a56" stroke-width="3"/>
      <rect x="-32" y="-10" width="64" height="20" rx="10" fill="#1c1c24" stroke="#5a5a68" stroke-width="2"/>
    </g>
  <!-- Cable conectado -->
  <path d="M300 330 L300 440 L280 470 L280 560"
        fill="none" stroke="#57B75B" stroke-width="14" stroke-linecap="round"/>
  <rect x="286" y="304" width="28" height="30" rx="6" fill="#194a24" stroke="#57B75B" stroke-width="2.5"/>
  <!-- Rayo de carga -->
  <path d="M304 390 L286 422 L299 422 L294 454 L316 418 L303 418 Z"
        fill="#FFE01A"/>
  
    <g transform="translate(300,520)">
      <circle r="25" fill="#57B75B" opacity="0.2" stroke="#57B75B" stroke-width="2"/>
      <path d="M-11 1 L-3 9 L12 -9" fill="none" stroke="#8ce090" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  <text x="300" y="565" text-anchor="middle" font-family="Outfit,sans-serif" font-size="15" font-weight="600" fill="#8ce090" opacity="0.9">Carga con normalidad</text>
  <rect x="162" y="72" width="276" height="596" rx="26" fill="url(#brillo)"/>

  <g font-family="Outfit, sans-serif" text-anchor="middle">
    <rect x="205" y="690" width="190" height="34" rx="17" fill="#57B75B" opacity="0.17" stroke="#57B75B" stroke-opacity="0.55"/>
    <text x="300" y="713" fill="#8ce090" font-size="17" font-weight="700">DESPU&#201;S</text>
  </g></svg>